<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeachCast Korea — 전국 해수욕장 날씨</title>
  <meta name="description" content="기상청 전국 해수욕장 날씨 Open API를 이용한 전국 해수욕장 날씨 지도" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3GmY5z6a7Q6X6M2X4Y5VfXhZ7rQ7A=" crossorigin=""/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">🌊 BeachCast Korea</div>
      <div class="subtitle">전국 해수욕장 날씨를 한눈에</div>
    </div>
    <button id="refreshBtn" class="refresh-btn">↻ 최신 날씨</button>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-badge">
        <b id="beachCount">420</b>개 해수욕장
      </div>
      <div class="legend">
        <span><i class="dot"></i> 해수욕장</span>
        <span>마커를 클릭하면 상세 날씨</span>
      </div>
    </section>

    <aside class="sidebar">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="해수욕장 이름 검색" />
        <select id="regionSelect" aria-label="지역 필터">
          <option value="">전체 지역</option>
        </select>
      </div>

      <div id="welcome" class="welcome">
        <div class="welcome-icon">🏖️</div>
        <h2>해수욕장을 선택하세요</h2>
        <p>지도에서 마커를 클릭하거나 위 검색창에서 해수욕장을 찾아보세요.</p>
      </div>

      <div id="detail" class="detail hidden">
        <div class="detail-head">
          <div>
            <div class="eyebrow">SELECTED BEACH</div>
            <h1 id="beachName">-</h1>
            <p id="coords">-</p>
          </div>
          <button id="closeDetail" class="icon-btn">×</button>
        </div>

        <div id="status" class="status">날씨 정보를 불러오는 중...</div>

        <div class="current-card">
          <div class="weather-main">
            <div id="weatherIcon" class="weather-icon">☀️</div>
            <div>
              <div id="currentTemp" class="current-temp">--°</div>
              <div id="currentSky" class="current-sky">-</div>
            </div>
          </div>
          <div class="current-grid">
            <div><span>강수확률</span><b id="currentPop">-</b></div>
            <div><span>습도</span><b id="currentReh">-</b></div>
            <div><span>바람</span><b id="currentWind">-</b></div>
            <div><span>파고</span><b id="currentWave">-</b></div>
          </div>
        </div>

        <div class="section-title">시간대별 예보</div>
        <div id="forecastList" class="forecast-list"></div>

        <div class="info-grid">
          <div class="info-card"><span>🌊 수온</span><b id="waterTemp">-</b></div>
          <div class="info-card"><span>🌅 일출</span><b id="sunrise">-</b></div>
          <div class="info-card"><span>🌇 일몰</span><b id="sunset">-</b></div>
          <div class="info-card"><span>🌊 파고</span><b id="wave">-</b></div>
        </div>

        <div class="section-title">조석</div>
        <div id="tideList" class="tide-list"></div>
      </div>
    </aside>
  </main>

  <footer>
    <span>데이터 출처: 기상청 전국 해수욕장 날씨 조회서비스</span>
    <span>지도: OpenStreetMap · Leaflet</span>
  </footer>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
